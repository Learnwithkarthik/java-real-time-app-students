spring.application.name=campus-enrollment-api
server.port=${PORT:8080}
# H2 FILE database survives restarts; delete ./data/ only when you intentionally reset lab data.
spring.datasource.url=jdbc:h2:file:./data/campusdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=Campus Enrollment API
info.app.description=Teaching lab for Maven, Nexus and SonarQube
